[build-system]
requires = ["setuptools==67.8.0", "wheel==0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surgeonadaptrl"
version = "1.0.0"
requires-python = "==3.10.*"
dependencies = [
  "torch==2.0.1",
  "torchvision==0.15.2",
  "numpy==1.24.4",
  "scipy==1.10.1",
  "scikit-learn==1.2.2",
  "Pillow==9.5.0",
  "PyYAML==6.0",
]

[project.scripts]
surgeonadaptrl-train = "surgeonadaptrl.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120
target-version = ["py310"]
